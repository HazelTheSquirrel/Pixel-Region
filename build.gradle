plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'de.pixelregion'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    paperweight.paperDevBundle("26.2.build.121-stable")
    implementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
    options.compilerArgs.addAll(['-Xlint:all'])
}

tasks.test {
    useJUnitPlatform()
}

tasks.register('verifyPixelRegionSourceBoundaries') {
    group = 'verification'
    description = 'Rejects legacy Bukkit/NMS APIs and static live-server references.'
    doLast {
        def sourceRoot = file('src/main/java')
        def forbidden = [
                ~/org\.bukkit\.ChatColor/,
                ~/net\.md_5\.bungee\.api\.ChatColor/,
                ~/net\.minecraft\.server\.v[0-9_]+/,
                ~/org\.bukkit\.craftbukkit/,
                ~/static\s+(?:final\s+)?(?:Player|Entity|World)\s+\w+\s*(?:=|;)/,
                ~/static\s+(?:final\s+)?[\w<>?, .]+\s+\w*(?:Player|Entity|World)\w*\s*(?:=|;)/
        ]
        fileTree(sourceRoot).matching { include '**/*.java' }.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            forbidden.each { pattern ->
                if (pattern.matcher(text).find()) {
                    throw new GradleException("Forbidden API boundary in ${sourceFile}: ${pattern}")
                }
            }
        }
    }
}

tasks.shadowJar {
    archiveFileName = "Pixel-Region.jar"
    relocate 'com.google.gson', 'de.pixelregion.libs.gson'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.register('verifyPixelRegionShadedDependencies') {
    group = 'verification'
    description = 'Verifies that the bundled Gson runtime is actually relocated.'
    dependsOn tasks.named('shadowJar')
    doLast {
        def jarFile = tasks.shadowJar.archiveFile.get().asFile
        if (!jarFile.isFile()) {
            throw new GradleException("Shadow JAR not found: ${jarFile}")
        }

        def forbiddenPrefixes = ['com/google/gson/']
        def classEntries = zipTree(jarFile).matching { include '**/*.class' }.files
        classEntries.each { entry ->
            def normalized = entry.path.replace('\\', '/')
            if (forbiddenPrefixes.any { prefix -> normalized.contains("/${prefix}") || normalized.startsWith(prefix) }) {
                throw new GradleException("Unrelocated third-party class in shadow JAR: ${normalized}")
            }
        }
    }
}

tasks.check {
    dependsOn tasks.named('verifyPixelRegionSourceBoundaries')
    dependsOn tasks.named('verifyPixelRegionShadedDependencies')
}

tasks.jar {
    archiveClassifier.set('slim')
}

tasks.build {
    dependsOn tasks.shadowJar
}
